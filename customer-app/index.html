    <script>
      // Immediate routing guard: if opened under /admin, redirect immediately to admin dashboard
      if (window.location.pathname.toLowerCase().includes('/admin')) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        var targetAdmin = window.location.origin + '/neelam-ki-gharelu-rasoi/admin/index.html';
        if (window.location.href !== targetAdmin) {
          window.location.replace(targetAdmin);
        }
      }
    </script>
    <meta name="description" content="Neelam Ki Gharelu Rasoi - Ghar jaisa shuddh shakahari khana in Moradabad, UP. Order fresh homemade breakfast, thalis, lunch and snacks." />
